<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table</title>
<link rel="stylesheet" href="../web/table.css">
<style>
  /* The page around the table; its look comes from table.css. */
  :root { color-scheme: light dark; --page: #ffffff; --text: #1e1f22; }
  @media (prefers-color-scheme: dark) { :root { --page: #1f2123; --text: #dfe1e5; } }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; gap: 8px; padding: 16px; box-sizing: border-box; background: var(--page); color: var(--text); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #tasks { flex: none; height: 240px; }
  #plain { flex: none; height: 120px; }
  #said { min-height: 18px; margin: 0; }
</style>
</head>
<body>
<div id="tasks"></div>
<div id="plain"></div>
<p id="said"></p>
<input id="field" aria-label="A field of the page">
<script src="../web/table.js"></script>
<script>
  window.said = [];
  const tell = (...x) => { said.push(x); document.getElementById("said").textContent = x.join(" "); };
  const PEN = "<svg viewBox='0 0 16 16'><path d='M3 13l1-3 7-7 2 2-7 7z'/></svg>";

  window.GROUPS = [
    { id: "atlas", label: "Atlas", color: "#2675bf" },
    { id: "orion", label: "Orion", color: "#b83a31", detail: "2 open · 1 done" },
    { id: "vega", label: "Vega", color: "#1baf7a" },
  ];
  window.ROWS = [
    { id: "t1", group: "atlas", name: "Write the brief", due: "2026-10-30", size: 3, flagged: false },
    { id: "t2", group: "atlas", name: "Call the printer", due: "2026-10-24", size: 12, flagged: true },
    { id: "t3", group: "atlas", name: "Book the venue", due: "2026-11-02", size: 5, flagged: false },
    { id: "t4", group: "orion", name: "Order the cake", due: "2026-10-26", size: 1, flagged: false },
    { id: "t5", group: "orion", name: "Pick the music", due: null, size: 8, flagged: false },
    { id: "t6", group: "orion", name: "Choose a date", due: "2026-10-01", size: 2, flagged: false, dim: true },
    { id: "t7", group: "nowhere", name: "Loose end", due: "2026-12-01", size: 4, flagged: false },
  ];
  const short = iso => (iso ? new Date(iso + "T12:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "—");
  window.tasks = TaurisTable.mount(document.getElementById("tasks"), {
    label: "Tasks",
    columns: [
      { key: "name", label: "Task", title: true },
      { key: "due", label: "Due", width: 90, align: "right", render: t => short(t.due), value: t => t.due },
      { key: "size", label: "Size", width: 70, align: "right" },
      { label: "Actions", actions: [
        { id: "flag", icon: "⚑", title: "Flag", pressed: t => t.flagged, onClick: t => { t.flagged = !t.flagged; tell("flag", t.id, t.flagged); tasks.setRows(ROWS); } },
        { id: "copy", icon: "⧉", title: "Copy Name", copy: t => t.name },
        { id: "edit", icon: PEN, title: "Edit", onClick: (t, i) => tell("edit", t.id, i.how) },
      ] },
    ],
    rows: ROWS,
    groups: GROUPS,
    onSelect: (t, i) => tell("select", t ? t.id : null, i.how),
    onOpen: (t, i) => tell("open", t.id, i.how, i.cmd),
    onContextMenu: (t, at) => tell("menu", t ? t.id : null, at.how),
    onSort: s => tell("sort", s ? s.key : null, s ? s.up : null),
    onKey: (e, t) => { if (e.key === " " && t) { tell("space", t.id); return true; } return false; },
    onGroupOpen: g => tell("group-open", g.id),
    onGroupContextMenu: g => tell("group-menu", g.id),
    onMessage: (text, kind) => tell("message", text, kind),
  });

  window.plain = TaurisTable.mount(document.getElementById("plain"), {
    columns: [{ key: "name", label: "Name" }, { key: "n", label: "N", width: 60, align: "right", sortable: false }],
    rows: [],
    labels: { empty: "No people yet." },
  });
</script>
</body>
</html>
