<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glance</title>
<link rel="stylesheet" href="../web/glance.css">
<style>
  /* The page around the figures; their look comes from glance.css. */
  :root { color-scheme: light dark; --page: #ffffff; --text: #1e1f22; --sel: #2675bf; }
  @media (prefers-color-scheme: dark) { :root { --page: #1f2123; --text: #dfe1e5; --sel: #2f65ca; } }
  body { margin: 0; padding: 16px; background: var(--page); color: var(--text); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  table { border-collapse: collapse; }
  td { height: 24px; padding: 0 10px; }
  tr[aria-selected="true"] td { color: #fff; background: var(--sel); }
  header { margin-bottom: 12px; }
</style>
</head>
<body>
<header id="head"></header>
<table><tbody id="rows"></tbody></table>
<script src="../web/glance.js"></script>
<script>
  const KPIS = [
    { id: "a", name: "Revenue", kind: "ok", word: "On track", values: [3, 5, 4, 8, 9] },
    { id: "b", name: "Churn", kind: "warn", word: "Behind", values: [["2026-09-01", 4], ["2026-09-08", 6], ["2026-10-01", 5]] },
    { id: "c", name: "Uptime", kind: "bad", word: "Off", values: [{ x: 1, y: 99 }, { x: 2, y: 97 }] },
    { id: "d", name: "Signups", kind: "done", word: "Reached", values: [7] },
    { id: "e", name: "NPS", kind: "new", word: "New", values: [] },
    { id: "f", name: "Leads", kind: "none", word: "No values", values: [] },
  ];
  document.getElementById("rows").replaceChildren(...KPIS.map((k, i) => {
    const tr = document.createElement("tr");
    tr.dataset.id = k.id;
    if (i === 0) tr.setAttribute("aria-selected", "true");
    const name = document.createElement("td");
    name.textContent = k.name;
    const status = document.createElement("td");
    status.append(TaurisGlance.status(k.kind, k.word));
    const spark = document.createElement("td");
    spark.append(TaurisGlance.sparkline(k.values, { label: `${k.name}, last weeks` }));
    tr.append(name, status, spark);
    return tr;
  }));
  document.getElementById("head").append(TaurisGlance.capacity({
    label: "Open tasks", max: 20,
    items: [{ title: "Brief · Atlas", color: "#2675bf" }, { title: "Venue · Orion", color: "#b83a31" }, { title: "Cake · Orion", color: "#b83a31" }],
  }));
</script>
</body>
</html>
