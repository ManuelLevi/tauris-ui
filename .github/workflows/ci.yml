name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/basic/src-tauri
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features files -- -D warnings
      # On Windows a test program that links Tauri needs an app manifest to
      # start (STATUS_ENTRYPOINT_NOT_FOUND without one), which only real apps
      # get from tauri-build. There the tests are compiled; they run on macOS
      # and Linux, and the example app below builds on all three.
      - if: runner.os != 'Windows'
        run: cargo test && cargo test --features files
      - if: runner.os == 'Windows'
        run: cargo test --no-run && cargo test --no-run --features files
      - name: Example app builds, without warnings
        working-directory: examples/basic/src-tauri
        run: cargo clippy -- -D warnings && cargo build
      - name: Example app passes the checker
        env:
          PYTHONUTF8: "1"
        run: python scripts/doctor.py examples/basic

  # A real app on macOS: a Dock click and File › New Window must open their
  # windows (a window opened inside the plugin's event handler froze the app).
  freeze-check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: test/freeze_check
      - name: No warnings
        working-directory: test/freeze_check
        run: cargo clippy -- -D warnings
      - name: The Dock click and New Window open their windows
        working-directory: test/freeze_check
        run: cargo run

  minimum-rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo build

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 pillow && python -m playwright install --with-deps chrome
      - run: python test/run.py
      - run: python test/tree_run.py
      - run: python test/terminal_run.py
      - run: python test/files_run.py
      - run: python test/menus_run.py
      - run: python test/doctor_run.py
