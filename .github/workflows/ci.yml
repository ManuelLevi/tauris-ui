name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/basic/src-tauri
            examples/all/src-tauri
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features files -- -D warnings
      # Every system runs the window tests (on Windows the test program gets the
      # app manifest Tauri needs from build.rs).
      - run: cargo test && cargo test --features files
      - name: Example app builds, without warnings
        working-directory: examples/basic/src-tauri
        run: cargo clippy -- -D warnings && cargo build
      - name: Example with every component builds, without warnings
        working-directory: examples/all/src-tauri
        run: cargo clippy -- -D warnings && cargo build
      # As a person runs it (no PYTHONUTF8: the checker sets its own output's encoding).
      - name: Example apps pass the checker
        run: python scripts/doctor.py examples/basic && python scripts/doctor.py examples/all
      - name: The checker's own tests, on every system
        run: python test/doctor_run.py

  # A real app on macOS: a Dock click and File › New Window must open their
  # windows (a window opened inside the plugin's event handler froze the app).
  freeze-check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: test/freeze_check
      - name: No warnings
        working-directory: test/freeze_check
        run: cargo clippy -- -D warnings
      - name: The Dock click and New Window open their windows
        working-directory: test/freeze_check
        run: cargo run

  # Without a lockfile, the newest dependencies that still build on 1.90 (a
  # dependency raising its own minimum does not break this check).
  minimum-rust:
    runs-on: macos-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo build && cargo build --features files

  page:
    runs-on: ubuntu-latest
    # A page that hangs the browser fails the job, not after six hours.
    timeout-minutes: 20
    env:
      TAURIS_TEST_CHROMIUM: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The Chromium that comes with this Playwright: the same browser every day.
      - run: pip install playwright==1.48.0 pillow && python -m playwright install --with-deps chromium
      - run: python test/run.py
      - run: python test/tree_run.py
      - run: python test/terminal_run.py
      - run: python test/files_run.py
      - run: python test/menus_run.py
      - run: python test/sidebar_run.py
      - run: python test/finder_run.py
      - run: python test/dialog_run.py
      - run: python test/reorder_run.py
      - run: python test/glance_run.py
      - run: python test/table_run.py
      - run: python test/status_run.py
      - run: python test/all_run.py
      - run: python test/doctor_run.py

  # WebKit: what Tauri renders with on macOS (WKWebView) and Linux (WebKitGTK).
  page-webkit:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      TAURIS_TEST_WEBKIT: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The WebKit that comes with this Playwright: the same browser every day.
      - run: pip install playwright==1.48.0 pillow && python -m playwright install webkit
      - run: python test/run.py
      - run: python test/tree_run.py
      - run: python test/terminal_run.py
      - run: python test/files_run.py
      - run: python test/menus_run.py
      - run: python test/sidebar_run.py
      - run: python test/finder_run.py
      - run: python test/dialog_run.py
      - run: python test/reorder_run.py
      - run: python test/glance_run.py
      - run: python test/table_run.py
      - run: python test/status_run.py
      - run: python test/all_run.py
