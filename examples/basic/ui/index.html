<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tabs Example</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="strip"></header>
  <main id="page">
    <input id="title" aria-label="Note title" autocomplete="off">
    <textarea id="note" aria-label="Note" placeholder="Write something. Each tab keeps its own note, and it is still here after a restart."></textarea>
    <p id="status" role="status"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
