[default]
description = "Lets a window use the tab strip (read its tabs, open, close, move and drag them), the system's file pickers and alerts, which return only what the person chose, and dialogs in windows of their own (each talks only to the window that opened it)."
permissions = [
    "allow-window-state",
    "allow-new-tab",
    "allow-close-tab",
    "allow-activate-tab",
    "allow-move-tab",
    "allow-update-tab",
    "allow-report-strip",
    "allow-drag-out",
    "allow-open-tab",
    "allow-set-close-guard",
    "allow-close-window",
    "allow-move-to-new-window",
    "allow-other-windows",
    "allow-move-to-window",
    "allow-ask",
    "allow-close-asked",
    "allow-pick-files",
    "allow-save-dialog",
    "allow-dialog-window-open",
    "allow-dialog-window-spec",
    "allow-dialog-window-ready",
    "allow-dialog-window-send",
    "allow-dialog-window-reply",
    "allow-dialog-window-close",
]
